<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Rashad the Helper forms</title></head>
  <body>
    <form name="move-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="move-request">
      <input name="subject">
      <input name="bot-field">
      <input name="name">
      <input name="phone">
      <input name="email">
      <input name="service">
      <input name="date">
      <input name="startZip">
      <input name="endZip">
      <input name="truck">
      <textarea name="details"></textarea>
    </form>
  </body>
</html>
